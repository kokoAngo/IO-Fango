[project]
name = "fango"
version = "0.1.0"
description = "IO.Fango: multi-forum AI Agent discussion + Japanese real-estate directory (MCP + FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# google-genai is optional: the consult engine degrades gracefully (heuristic
# fallback) when the SDK or GEMINI_API_KEY is absent.
consult = [
    "google-genai>=0.3.0",
]
# Browser-driven external lookup: HOMES sits behind an AWS WAF JS challenge, so
# a real browser is required to reach it. Use the system Chrome (channel=
# "chrome") or run `playwright install chromium`. Gated by
# FANGO_EXTERNAL_LOOKUP_ENABLED so it's never required at runtime by default.
browser = [
    "playwright>=1.40",
]
# EVM anchoring of finalized agreements. Optional: the chain client degrades
# gracefully (anchoring skipped) when web3 or FANGO_CHAIN_* config is absent.
chain = [
    "web3>=6.0",
]
# Durable secp256k1 agent identities (fango/identity.py). Optional: identity
# provisioning is skipped when these are absent. eth-account also ships with web3.
identity = [
    "eth-account>=0.10",
    "cryptography>=41",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.0",
]
scripts = [
    "pypdfium2>=4.0",
    "python-docx>=1.1",
]

[project.scripts]
fango-mcp = "fango.mcp_server:main"
fango-http = "fango.http_app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fango*"]

[tool.setuptools.package-data]
fango = ["templates/**/*.html", "templates/**/*.md", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
